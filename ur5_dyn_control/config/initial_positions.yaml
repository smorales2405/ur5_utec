# Literales numericos: xacro.load_yaml no evalua expresiones tipo pi.
shoulder_pan_joint: 1.5708
shoulder_lift_joint: -1.5708
elbow_joint: 1.5708
wrist_1_joint: -1.5708
wrist_2_joint: -1.5708
wrist_3_joint: 0.0
