gz_fl_control_node:
  ros__parameters:
    use_sim_time: true

    # -- Lazo de control ---------------------------------------------------
    # Timer de PARED a control_rate; la trayectoria se indexa por tiempo de
    # SIMULACION (robusto a RTF < 1, p.ej. ~0.07 en lab_torque_world).
    control_rate: 500.0

    # -- Modelo dinamico -----------------------------------------------------
    urdf_path: ""          # "" -> ur5_kinematics/share/ur5e.urdf (brazo solo)
    gravity: 9.8           # igual que <gravity> del mundo Gazebo

    # -- G3: gravedad en el comando de torque ---------------------------------
    # true  (Gazebo)    -> tau_cmd = tau_ley           (el plugin aplica g)
    # false (UR5e real) -> tau_cmd = tau_ley - g(q)    (direct_torque compensa
    #                      la gravedad DENTRO del robot; comandarla la duplica)
    # Ver docs/00_prereqs.md (G3) y test/test_gravity_policy.cpp.
    gravity_in_command: true

    # -- A2: frame operacional (punta de la hoja == gripper_tcp) --------------
    # Distancia desde tool0 a lo largo de su Z. Unica definicion del offset:
    # la IK de JointReferenceGenerator la toma de aqui via Ur5Dynamics.
    # 0.162686 m = vertice de z maximo de la malla del acople (la punta de la
    # hoja). TIENE que coincidir con scalpel_tcp_offset_z de
    # urdf/scalpel_tool.xacro, que es lo que se monta en Gazebo.
    tcp_offset_z: 0.162686

    # -- A1 LEVANTADO: acople porta-bisturi montado en el TCP -----------------
    # Ya no es "brazo solo": urdf/scalpel_tool.xacro anade el acople a la
    # planta de Gazebo, y estos valores lo anaden al modelo de Pinocchio del
    # controlador. Si se desactiva uno hay que desactivar el otro, o el
    # controlador compensara una gravedad que no es la de la planta.
    # Fuente: physical_properites_toolscalpel.png (Autodesk Inventor), medido
    # respecto del Work Point del CAD == tool0.
    #   masa 0.182 kg   CoG (-2.227, 2.134, 29.398) mm desde tool0
    # `tool_com` va en el frame TCP, asi que se traslada:
    #   com_TCP = com_tool0 - [0, 0, tcp_offset_z]
    tool_mass: 0.182                      # [kg]
    tool_com: [-0.002227, 0.002134, -0.133288]   # [m] en el frame TCP
    tool_inertia: [2.39199e-4, 2.54858e-4, 1.19620e-4,   # [kg m^2] resp. al CoM:
                   -8.80e-7, -3.820e-6, -7.570e-6]       #   [Ixx,Iyy,Izz,Ixy,Ixz,Iyz]

    # -- Pose inicial (= initial_positions.yaml del bringup) -----------------
    q_init: [1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 3.1416]

    # -- Plumbing de comandos / switch (portable al robot real) --------------
    command_topic: "/forward_effort_controller/commands"
    controller_manager: "/controller_manager"
    activate_controllers: ["joint_state_broadcaster", "forward_effort_controller"]
    # deactivate_controllers: en sim se omite (lista vacia no es valida en YAML
    # de rclcpp). En el robot real: ["scaled_joint_trajectory_controller"].
    perform_switch: true
    perform_unpause: true           # despausa Gazebo al estar listo (solo sim)
    world_name: "default"

    # -- Fases ----------------------------------------------------------------
    hold_start_duration: 1.0
    transition_duration: 3.0        # rampa quintica q0 -> inicio de la trayectoria
    t_sim: 0.0                      # duracion de HOLD_END; 0 = indefinido
    skip_trajectory: false

    # -- Ganancias FL (criticamente amortiguado, wn = 10 rad/s) ---------------
    kp: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
    kd: [ 20.0,  20.0,  20.0,  20.0,  20.0,  20.0]
    tau_max: [150.0, 150.0, 150.0, 28.0, 28.0, 28.0]

    # -- Trayectoria cartesiana de referencia ---------------------------------
    # Frame base_link (z=0 en la base del robot; z_Gazebo = z + 0.63).
    # Orientacion del TCP constante: gripper apuntando hacia abajo.
    # W0 ~= FK(q_init) = [0.492, 0.133, 0.347] -> rampa inicial minima.
    # Barrido suave dentro del espacio de trabajo, lejos del obstaculo (x=0.85).
    tcp_orientation_rpy: [3.14159265, 0.0, 3.14159265]
    waypoints_xyz: [0.49,  0.13, 0.35,
                    0.55,  0.35, 0.28,
                    0.55, -0.10, 0.25,
                    0.49, -0.35, 0.32]
    waypoint_times: [0.0, 2.5, 5.0, 7.5]

    # -- IK (QP de ur5_kinematics, target gripper_tcp) ------------------------
    ik_seed: [1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 3.1416]
    ik_max_iterations: 450
    ik_alpha: 0.5
    ik_weight_pos: 1.0
    ik_weight_orient: 1.0
    q_jump_tol: 0.15

    # -- Logging ----------------------------------------------------------------
    csv_output_dir: ""              # "" -> ~/.ros/ur5_dyn_control/
    test_num: 1
