# ============================================================================
#  LQR-SDRE sobre la trayectoria de INCISION — pesos de la ley (FASE 4)
#
#  Controlador: gz_lqr_sdre_control_node. La trayectoria, la herramienta, la
#  friccion y los limites NO estan aqui: viven en incision_common.yaml, que los
#  launches cargan ANTES de este fichero porque declara
#  `trajectory_type: incision` (launch/param_layers.py). Solo cambian la ley y
#  sus pesos. Ver docs/04_lqr_sdre.md.
#
#  Ejecucion directa (sin launch): pasar los DOS ficheros, el comun primero:
#    ros2 run ur5_dyn_control gz_lqr_sdre_control_node --ros-args \
#      --params-file <share>/config/incision_common.yaml \
#      --params-file <share>/config/lqr_sdre_params.yaml
# ============================================================================

gz_lqr_sdre_control_node:
  ros__parameters:
    # Hace que los launches carguen incision_common.yaml antes de este fichero.
    trajectory_type: "incision"

    # -- Pesos del LQR-SDRE (FASE 4) -----------------------------------------
    #
    # No se dan Q y R en bruto: se dan wn, zeta y r, y el nodo SINTETIZA
    #
    #     Qp = r wn^4 M(q_init)^2
    #     Qv = r wn^2 (4 zeta^2 - 2) M(q_init)^2
    #     R  = r I
    #
    # POR QUE M^2 Y NO NUMEROS SUELTOS. Con A = [0 I; 0 0] y B = [0; M^-1], la
    # CARE se parte en  P12 G22 P12^T = Qp  y  P12 + P12^T - P22 G22 P22 + Qv = 0
    # con G22 = M^-2 / r, y la realimentacion sale Kp = M^-1 P12^T / r,
    # Kd = M^-1 P22 / r. Pedir el lazo cerrado M q̈_e + Kd q̇_e + Kp q_e = 0 con
    # TODOS los modos en (wn, zeta) equivale a Kp = wn^2 M y Kd = 2 zeta wn M,
    # es decir P12 = r wn^2 M^2 y P22 = 2 r zeta wn M^2, y de ahi las Q de
    # arriba. MEDIDO: los 12 autovalores caen en -wn con residuo 1.6e-14.
    #
    # POR QUE LA M COMPLETA Y NO SU DIAGONAL. M(q_init) no es diagonal ni de
    # lejos: M(1,5) = 2.8e-2 con M(5,5) = 5.4e-3, un acoplo CINCO veces la
    # propia diagonal. Con Qp_ii = I_ii^2 wn^4 los polos MEDIDOS se dispersan de
    # 8.4 a 290 rad/s (34x) y max|lambda|*dt sube a 0.58, muy por encima del
    # limite de estabilidad discreta. Es el mismo escalado por inercia que ya
    # hizo falta en gravity_comp y en el eta del SMC — cuarta vez. Fijado por
    # test_care_solver::QConLaDiagonalDeMDispersaLosPolos.
    #
    # wn = 20 rad/s: mismo polo nominal que el lambda del SMC, para comparar a
    # igualdad de ancho de banda. Da max|lambda|*dt = 0.040 a 500 Hz, el mismo
    # numero de estabilidad discreta que el SMC.
    lqr.wn: 20.0
    # zeta >= 1/sqrt(2) es OBLIGATORIO: con zeta menor la Qv de arriba sale
    # definida negativa. No es una limitacion del codigo, es el resultado
    # clasico de que un LQR sobre un doble integrador no amortigua por debajo de
    # Butterworth; zeta = 1/sqrt(2) es exactamente el caso Qv = 0.
    lqr.zeta: 1.0
    # r: peso del esfuerzo. Solo importa el COCIENTE Q/R, asi que con la Q de
    # arriba proporcional a r el lazo cerrado no cambia con r; se deja como
    # gancho para la FASE 7.
    lqr.r: 1.0
    # fixed     : Q constante, sintetizada con M(q_init). Es la formulacion del
    #             plan (Q y R son pesos de COSTE) y deja que max Re(lambda)
    #             varie a lo largo de la trayectoria, que es el artefacto de
    #             paper que se pide.
    # scheduled : Q(q) recalculada en cada actualizacion de la CARE. El marco
    #             SDRE admite pesos dependientes del estado y asi los polos
    #             caen en -wn en TODA la trayectoria.
    lqr.Q_mode: "fixed"

    # -- Solver de la CARE ----------------------------------------------------
    # 0 = resolver en CADA ciclo. Medido: 57 us por resolucion (12 estados, 6
    # entradas) frente a los 2000 us de presupuesto a 500 Hz, asi que NO hace
    # falta decimar. Si en el robot real no cupiese, poner aqui 50-100 Hz: la K
    # se mantiene con ZOH entre actualizaciones y el CSV de diagnostico registra
    # la decimacion efectiva por paso (columna care_updated).
    lqr.care_update_rate: 0.0
    lqr.care_max_iterations: 60
    lqr.care_tol: 1.0e-11
    # Residuo relativo maximo de la CARE (medido en coordenadas balanceadas)
    # para aceptar la K nueva. Las corridas sanas dan 1e-14.
    lqr.residual_tol: 1.0e-6
    # Se exige max Re(eig(A - B K)) < -stable_margin en cada actualizacion.
    lqr.stable_margin: 1.0e-9
    # Certificacion de estabilizabilidad del par (A,B) por controlabilidad. Para
    # este par solo se pierde si M(q) se vuelve numericamente singular.
    lqr.controllability_tol: 1.0e-9
    # Fallos SEGUIDOS de la CARE antes de pedir SAFE_HOLD. Uno aislado se cubre
    # con ZOH sobre la ultima K valida; una racha significa que el problema ya
    # no es el paso sino el diseno.
    lqr.max_consecutive_failures: 5

    # CSV de diagnostico `lqr_diag_<test_num>.csv` (fichero APARTE del CSV
    # unificado, cuyo esquema es comun a los cuatro controladores): max Re(eig),
    # cond(M), margen de controlabilidad, residuo, iteraciones, tiempos de
    # computo. De aqui salen la figura de max Re(lambda) vs t y la tabla de
    # tiempos que pide el plan.
    lqr.diag_csv: true
    lqr.diag_decimation: 1
