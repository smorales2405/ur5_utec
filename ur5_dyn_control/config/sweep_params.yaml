# ============================================================================
#  Barrido de EXCITACION para identificar friccion articular — FASE 2
#
#  Barre UNA junta a velocidad constante en ambos sentidos, con las demas
#  sostenidas en q_fixed. Solo la MESETA de cada barrido (velocidad constante,
#  aceleracion nula) es ventana util: alli el residuo
#
#      tau_residual = tau_cmd - RNEA(q, q_dot, q_ddot)
#
#  es friccion pura. El CSV marca esas ventanas en la columna `state` con
#  etiquetas SWEEP_<v>_POS / SWEEP_<v>_NEG; las rampas quedan como SWEEP_RAMP y
#  las transiciones como SWEEP_MOVE, para que el identificador las descarte sin
#  recalcular la temporizacion.
#
#  Uso (una junta por corrida; `sweep.joint` de 0 a 5):
#    ros2 launch ur5_dyn_control fl_control.launch.py gazebo_gui:=false \
#        params_file:=<...>/sweep_params.yaml test_num:=200 \
#        --ros-args -p sweep.joint:=0
#
#  Para VALIDAR el identificador contra la verdad, inyectar friccion conocida en
#  la planta de Gazebo (el URDF de UR viene con damping=0, friction=0):
#    ros2 launch ... joint_damping:=1.5 joint_friction:=2.5
# ============================================================================

gz_fl_control_node:
  ros__parameters:
    use_sim_time: true

    control_rate: 500.0

    urdf_path: ""
    gravity: 9.8
    q_init: [1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 3.1416]

    gravity_in_command: true         # G3 — false en el UR5e real

    tcp_offset_z: 0.162686               # punta de la hoja (malla del acople)
    # A1 LEVANTADO: el acople porta-bisturi va montado en la planta
    # (urdf/scalpel_tool.xacro) y estos valores lo meten en el modelo de
    # Pinocchio del controlador. Los dos van juntos o el controlador compensa
    # una gravedad que no es la de la planta.
    # physical_properites_toolscalpel.png: 0.182 kg, CoG (-2.227, 2.134,
    # 29.398) mm desde tool0; aqui en el frame TCP (= CoG - [0,0,tcp_offset_z]).
    tool_mass: 0.182                     # [kg]
    tool_com: [-0.002227, 0.002134, -0.133288]           # [m] en el frame TCP
    tool_inertia: [2.39199e-4, 2.54858e-4, 1.19620e-4,   # [kg m^2] resp. al CoM
                   -8.80e-7, -3.820e-6, -7.570e-6]       # [Ixx,Iyy,Izz,Ixy,Ixz,Iyz]

    command_topic: "/forward_effort_controller/commands"
    controller_manager: "/controller_manager"
    activate_controllers: ["joint_state_broadcaster", "forward_effort_controller"]
    perform_switch: true
    perform_unpause: true
    world_name: "default"

    hold_start_duration: 2.0
    transition_duration: 3.0
    t_sim: 2.0
    skip_trajectory: false

    # Ganancias de seguimiento. Altas para que el error de posicion sea pequeno
    # y el torque comandado refleje la dinamica + friccion, no el error.
    # Ganancias ESCALADAS POR INERCIA en las muñecas.
    #
    # La ley FL es tau = M(q)(ddq_d + kp*e + kd*de) + nle, así que la
    # autoridad frente a una perturbación de PAR —la fricción— es
    # `M_jj * kp_j`, no `kp_j`. Con kp uniforme eso recorre cuatro órdenes
    # de magnitud: 21.2 N·m por 0.2 rad de error en shoulder_pan frente a
    # 0.46 en wrist_1 y 0.01 en wrist_3.
    #
    # Medido en el robot real: wrist_1 no se movió NADA (0.12 deg frente a
    # los 66.1 pedidos) ni con la compensación interna en `default`. El par
    # físico entregado llegó a 2.849 N·m y su fricción estática es mayor,
    # mientras el techo con kp=100 es M*kp*e_max = 1.79 N·m. No es cuestión
    # del nivel de compensación: la ganancia era el límite.
    #
    # wrist_1 y wrist_2 se suben a la ganancia que da ~8 N·m con 0.2 rad de
    # error. kd = 2*sqrt(kp) mantiene amortiguamiento crítico: en FL el lazo
    # de error es `e'' + kd e' + kp e = 0`, independiente de la inercia.
    #
    # wrist_3 se queda en 100 A PROPÓSITO: necesitaría kp ~ 155 000, o sea
    # wn*dt = 0.79, fuera del rango de estabilidad discreta a 500 Hz. No es
    # barrible con control por par, y se salta con --skip.
    #
    #                                    wn [rad/s]   wn*dt
    #   wrist_1  kp=1700  kd= 82.46         41.2       0.082
    #   wrist_2  kp=7500  kd=173.21         86.6       0.173
    kp: [100.0, 100.0, 100.0, 1700.0, 7500.0, 100.0]
    kd: [ 20.0,  20.0,  20.0,   82.46, 173.21,  20.0]
    tau_max: [150.0, 150.0, 150.0, 28.0, 28.0, 28.0]

    # -- Compensacion de friccion ---------------------------------------------
    # Solo actua si se pasa `friction_compensation`; aqui se fijan las dos
    # decisiones de diseno, para no repetirlas en cada lanzamiento.
    friction:
      # Con la velocidad MEDIDA, F_c*tanh(dq/eps) se anula justo cuando la junta
      # esta clavada y no la desbloquea nunca — que es lo que impedia barrer las
      # muñecas por control de par (docs/02_friction_real.md 1).
      dq_source: "desired"
      # Pequeno porque la referencia no tiene ruido del que protegerse; eps es
      # lo unico que crea la banda sin compensar (docs/05_smc.md 7.7).
      # 1e-2 y no 1e-5. Bajarlo encoge la banda sin compensar, pero en una junta
      # ligera lo que importa es la DERIVADA: con 1e-5 el tanh es un escalon y
      # salta ~1 N.m entre ciclos consecutivos, que sobre M_55 = 0.00535 kg m2
      # son 184 rad/s2. Fugo wrist_2 162 grados en el robot real (smc_710). A
      # las velocidades de trabajo (0.05-0.5 rad/s) 1e-2 da tanh > 0.99, o sea
      # compensacion practicamente plena.
      dq_eps: 1.0e-2
      # Limite de tasa del feedforward [rad/s por ciclo]. Es la defensa de fondo:
      # acota el escalon aunque eps se vuelva a bajar. 0 = sin limite.
      ff_dv_max: 0.01
    trajectory_type: "joint_sweep"

    sweep:
      # Configuracion en la que se mantienen las juntas NO barridas.
      # (= q_init del paquete: pan 0, lift -pi/2, elbow pi/2,
      #    wrist_1 -pi/2, wrist_2 -pi/2, wrist_3 0)
      q_fixed: [1.5708, -1.5708, 1.5708, -1.5708, -1.5708, 3.1416]

      joint: 0                  # junta que se barre (0..5), una por corrida

      # +-45 grados desde q_fixed[joint].
      amplitude: 0.7853981634

      # Niveles de |q_dot| [rad/s], cada uno recorrido en AMBOS sentidos.
      # Espaciado casi logaritmico, mas denso abajo, que es donde vive el
      # efecto Stribeck.
      velocities: [0.02, 0.05, 0.10, 0.20, 0.35, 0.50, 0.75, 1.00]

      # Fraccion de cada barrido en rampa: la meseta util es (1 - 2*phi).
      ramp_fraction: 0.15

      # Cota de duracion por barrido [s]. Un nivel lento que no quepa REDUCE su
      # amplitud (nunca su velocidad, que es la variable independiente de la
      # identificacion). Con 40 s, los niveles <= 0.05 rad/s barren menos de
      # +-45 grados; el log reporta la amplitud efectiva de cada uno.
      max_sweep_duration: 40.0

      dwell: 1.0                # reposo entre barridos [s]
      approach_duration: 3.0    # transicion q_fixed -> primer extremo

      # Un nivel cuya rampa exigiria mas de esta aceleracion se RECHAZA en
      # construccion (no se recorta en silencio). Mismo valor declarado que en
      # la FASE 1 (ur_moveit_config; UR no publica limite de aceleracion).
      ddq_max: 5.0

    csv_output_dir: ""
    test_num: 200
    csv_hold_decimation: 10
