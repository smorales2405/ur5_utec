# ============================================================================
#  Computed Torque (CT) sobre la trayectoria de INCISION — ganancias de la ley
#
#  Controlador: gz_fl_control_node, la LINEA BASE del paper:
#      tau = M(q) (ddq_d + Kp e + Kd de) + n(q, dq)
#  La trayectoria, la herramienta, la friccion y los limites NO estan aqui:
#  viven en incision_common.yaml, que los launches cargan ANTES de este fichero
#  porque declara `trajectory_type: incision` (launch/param_layers.py). Asi el
#  CT ejecuta la MISMA tabla que el LQR-SDRE y el SMC. (Hasta B0 este fichero
#  llevaba su propio bloque, con la pose de partida del TCP viejo: V6 del plan.)
#
#  Uso:
#    ros2 launch ur5_dyn_control fl_control.launch.py \
#        params_file:=$(ros2 pkg prefix --share ur5_dyn_control)/config/incision_params.yaml
#  (el default de fl_control.launch.py es fl_control_params.yaml, la
#  trayectoria de waypoints de desarrollo, que NO es la incision).
#
#  Ejecucion directa (sin launch): pasar los DOS ficheros, el comun primero:
#    ros2 run ur5_dyn_control gz_fl_control_node --ros-args \
#      --params-file <share>/config/incision_common.yaml \
#      --params-file <share>/config/incision_params.yaml
# ============================================================================

gz_fl_control_node:
  ros__parameters:
    # Hace que los launches carguen incision_common.yaml antes de este fichero.
    trajectory_type: "incision"

    # wn = 10 rad/s, zeta = 1 en las seis juntas (Kp = wn^2, Kd = 2 zeta wn).
    # Las mismas desde la FASE 1; las de la campana salen de B5 (sintonia comun).
    kp: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
    kd: [ 20.0,  20.0,  20.0,  20.0,  20.0,  20.0]
